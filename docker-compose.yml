services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: battery
      POSTGRES_PASSWORD: battery
      POSTGRES_DB: solidstate_battery
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U battery -d solidstate_battery"]
      interval: 2s
      timeout: 2s
      retries: 20
    volumes:
      - battery-postgres:/var/lib/postgresql/data
volumes:
  battery-postgres:
